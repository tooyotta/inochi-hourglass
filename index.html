<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><meta name="description" content="限りある時間を、大切なことに。命の砂時計。"><title>命の砂時計</title><link rel="stylesheet" href="style.css?v=13"></head><body>
<header><h1 class="page-title"><a href="./" class="brand">命の砂時計</a></h1><button id="aboutOpen" class="about-button" aria-label="この砂時計について">i</button></header>
<main><section class="instrument" aria-label="砂時計タイマー"><button id="glassButton" class="glass" aria-label="砂時計を開始・一時停止（拡大中は下の開始ボタンを使用）"><img src="assets/hourglass-glass-only.png" width="1024" height="1536" alt="丸みのある透明なガラスだけの砂時計" fetchpriority="high"><svg viewBox="0 0 1024 1536" aria-hidden="true"><defs><linearGradient id="sand" x1="0" x2="1"><stop stop-color="#6c5030"/><stop offset=".2" stop-color="#b59a6d"/><stop offset=".48" stop-color="#d2bb8d"/><stop offset=".75" stop-color="#b3996e"/><stop offset="1" stop-color="#72583a"/></linearGradient><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="12" result="noise"/><feColorMatrix in="noise" type="saturate" values="0"/><feBlend in="SourceGraphic" mode="soft-light" result="textured"/><feComposite in="textured" in2="SourceGraphic" operator="in"/></filter><clipPath id="upper"><path d="M330 135C206 143 140 225 144 335C150 473 238 562 382 642C462 685 497 722 512 757C527 722 562 685 642 642C786 562 874 473 880 335C884 225 818 143 694 135Z"/></clipPath><clipPath id="lower"><path d="M512 778C480 833 401 865 312 935C205 1019 142 1126 146 1238C149 1324 189 1393 278 1410Q512 1440 746 1410C835 1393 875 1324 878 1238C882 1126 819 1019 712 935C623 865 544 833 512 778Z"/></clipPath></defs><g clip-path="url(#upper)"><path id="topSand" fill="url(#sand)" filter="url(#grain)"/><path id="surface" fill="none" stroke="#e3d0a8" stroke-opacity=".4" stroke-width="2"/></g><g clip-path="url(#lower)"><path id="bottomSand" fill="url(#sand)" filter="url(#grain)"/><path id="stream" stroke="#d8c295" stroke-width="2" stroke-dasharray="2 6"/></g></svg><canvas id="particles" width="1024" height="1536" aria-hidden="true"></canvas><img class="reflection" src="assets/hourglass-glass-only.png" width="1024" height="1536" alt="" aria-hidden="true"></button></section>
<section class="controls" aria-label="タイマー操作"><p id="state" class="sr-only">準備ができました</p><div id="time" class="time" role="timer" aria-label="残り990分">990<span>:</span>00</div><p id="sessionLabel" class="session-label"></p><p id="announcement" class="sr-only" aria-live="polite"></p><div class="actions"><button id="start" class="primary">▶ <span>はじめる</span></button><button id="reset" class="reset" aria-label="タイマーをリセット">↺</button></div>
<div class="presets" id="presets" aria-label="時間を選ぶ"><button data-min="990"><b>990<span>分</span></b><small>一日の時間</small></button><button data-min="3"><b>3<span>分</span></b><small>カップ麺</small></button><button data-min="5"><b>5<span>分</span></b><small>ひと休み</small></button><button data-min="15"><b>15<span>分</span></b><small>読書</small></button><button data-min="25"><b>25<span>分</span></b><small>集中</small></button></div>
<details class="options"><summary>時間・目的を設定する <span>＋</span></summary><div class="option-content"><label class="custom" for="minutes">時間<div><input type="number" id="minutes" min="1" max="990" step="1" value="990" inputmode="numeric" aria-describedby="validation"><span>分</span></div></label><p id="validation" class="validation" aria-live="polite"></p><label for="purpose" class="purpose-label">何に時間を使いますか？ <span>任意</span></label><input id="purpose" placeholder="例：読書、自分を整える" maxlength="60"><div class="option-bottom"><label><input type="checkbox" id="sound"> 終了音</label><button id="special" class="text-button">990分に戻す</button></div><p class="hint">カップ麺は商品の指定時間に合わせて変更できます。</p></div></details></section></main>
<dialog id="about"><button id="aboutClose" class="close" aria-label="閉じる">✕</button><h2>命の砂時計</h2><p>限りある時間を何に捧げるか。その考え方に共感して生まれた、静かなタイマーです。</p><p>熊谷正寿氏が会見で語った「命の砂時計」に着想を得ています。990分は、睡眠を除いた一日の時間という考え方に由来します。</p><p>小さなことでも、あなたにとって大切なことに。</p><p class="hint">GMOグループおよび熊谷氏とは関係のない個人制作です。設定はこのブラウザ内に保存されます。画面を閉じた状態での終了通知は保証されません。再読み込みで計測はリセットされます。</p><a href="https://www.itmedia.co.jp/business/articles/2611/07/news006.html" target="_blank" rel="noopener">着想の背景を読む ↗</a></dialog><script type="module" src="app.js?v=9"></script><script type="module" src="scene.js?v=7"></script></body></html>
